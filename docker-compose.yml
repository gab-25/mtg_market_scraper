# A fixed project name: containers and volumes are mtg_market_scraper-*, whatever the folder is called.
name: mtg_market_scraper

services:
  db:
    # Pinned: upgrading needs ALTER EXTENSION timescaledb UPDATE on the existing volume.
    image: timescale/timescaledb:2.30.2-pg17
    environment:
      POSTGRES_USER: mtg_market_scraper
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mtg_market_scraper}
      POSTGRES_DB: mtg_market_scraper
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mtg_market_scraper -d mtg_market_scraper"]
      interval: 5s
      timeout: 5s
      retries: 10

  grafana:
    image: grafana/grafana-oss:13.0.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_DISABLE_LOGIN_FORM: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/rising.json
      MTG_MARKET_SCRAPER_DB_HOST: db
      MTG_MARKET_SCRAPER_DB_NAME: mtg_market_scraper
      MTG_MARKET_SCRAPER_DB_READER_PASSWORD: ${MTG_MARKET_SCRAPER_DB_READER_PASSWORD:?set MTG_MARKET_SCRAPER_DB_READER_PASSWORD in .env}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      db:
        condition: service_healthy
    ports:
      # Only reachable from the host: put the HTTPS reverse proxy in front.
      - "127.0.0.1:3000:3000"

  sync:
    # Runs once on `docker compose up`; run it again with `docker compose run --rm sync`.
    build: .
    environment:
      DATABASE_URL: postgresql://mtg_market_scraper:${POSTGRES_PASSWORD:-mtg_market_scraper}@db:5432/mtg_market_scraper
      # The migrations create the read-only grafana_reader role with it, when the role is missing.
      MTG_MARKET_SCRAPER_DB_READER_PASSWORD: ${MTG_MARKET_SCRAPER_DB_READER_PASSWORD:?set MTG_MARKET_SCRAPER_DB_READER_PASSWORD in .env}
    volumes:
      - syncdata:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

volumes:
  pgdata:
  grafana-data:
  syncdata:
