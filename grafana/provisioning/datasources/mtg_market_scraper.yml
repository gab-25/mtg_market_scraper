apiVersion: 1

# Grafana installs set up before the rename have this datasource under its old name.
deleteDatasources:
  - name: Pulse
    orgId: 1

datasources:
  - name: MTG Market Scraper
    uid: mtg_market_scraper
    type: grafana-postgresql-datasource
    url: ${MTG_MARKET_SCRAPER_DB_HOST}:5432
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: ${MTG_MARKET_SCRAPER_DB_NAME}
      sslmode: ${MTG_MARKET_SCRAPER_DB_SSLMODE:-disable}
      postgresVersion: 1700
      timescaledb: true
    secureJsonData:
      password: ${MTG_MARKET_SCRAPER_DB_READER_PASSWORD}
